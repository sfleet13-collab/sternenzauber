<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sternenzauber Helferplan</title>
<meta name="description" content="Helferplan für die Standbesetzung beim Sternenzauber.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2B2F4A">
<meta name="color-scheme" content="light">
<link rel="manifest" href="site.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sternenzauber">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<style>
@font-face { font-family: "Figtree"; font-style: normal; font-display: swap; font-weight: 300 900; src: url(fonts/figtree-latin-wght-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD }
@font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-display: swap; font-weight: 200 800; src: url(fonts/bricolage-grotesque-latin-opsz-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-display: swap; font-weight: 500; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD }
:root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100% }
html, body { margin: 0 }
img { max-width: 100% }
[hidden] { display: none !important }
/* Layout: ein Tag pro Ansicht. Zeilen = Stände (nach Bereich gruppiert), Spalten = Schichten.
   Farbe bekommt nur, was Aufmerksamkeit braucht: offen, unvollständig, unbestätigt. */
:root {
  --bg: #F1F5F2; --surface: #FFFFFF; --surface-2: #E6EDE8; --line: #D2DCD5;
  --fg: #14201A; --muted: #586A60;
  --brand: #1F5A44; --brand-fg: #FFFFFF; --brand-soft: #DBE9E1;
  --open: #A3233A; --open-soft: #FBE8EC;
  --part: #7A4F00; --part-soft: #FBEDCB; --star: #B07A00;
  --shadow: 0 1px 2px rgba(20,32,26,.06), 0 8px 24px rgba(20,32,26,.06);
  --f-display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}


*, *::before, *::after { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.45 var(--f-body); }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px }
h1, h2, h3, p, ul { margin: 0 }
ul { padding: 0; list-style: none }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em }
.muted { color: var(--muted) }

.shell { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; display: flex; flex-direction: column; gap: 18px }

/* Kopf */
.top { display: flex; flex-wrap: wrap; gap: 14px 32px; align-items: flex-end; justify-content: space-between }
.top h1 { font: 700 clamp(26px, 4.4vw, 38px)/1.05 var(--f-display); letter-spacing: -.02em; text-wrap: balance }
.top .sub { color: var(--muted); margin-top: 4px }
.cover { min-width: min(100%, 300px); flex: 0 1 360px; display: flex; flex-direction: column; gap: 6px }
.cover .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2) }
.cover .bar i { display: block; height: 100% }
.cover .bar .b-ok { background: var(--brand) } .cover .bar .b-part { background: var(--part) } .cover .bar .b-open { background: var(--open) }
.cover .nums { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px }
.cover .nums b { font-variant-numeric: tabular-nums }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px }
.dot.ok { background: var(--brand) } .dot.part { background: var(--part) } .dot.open { background: var(--open) }

/* Reiter */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-top: 4px }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 9px; font-weight: 600; color: var(--muted); white-space: nowrap }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--brand) }
.tabs .n { font: 500 12px var(--f-mono); background: var(--open-soft); color: var(--open); border-radius: 10px; padding: 1px 7px; margin-left: 6px }

/* Steuerung */
.controls { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px }
.day { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px }
.day b { font: 700 18px/1.1 var(--f-display) }
.day small { color: var(--muted); font-size: 12.5px }
.day[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-fg) }
.day[aria-pressed="true"] small { color: inherit; opacity: .85 }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; font-size: 14px; font-weight: 500 }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.shiftpick { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px }
.shiftpick button { flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; text-align: left }
.shiftpick button[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand) }
.shead { display: flex; flex-direction: column; gap: 3px; align-items: flex-start }
.shead .t { font: 500 14px var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.shead .c { font-size: 12px; font-weight: 500; color: var(--muted) }
.shead .c.att { color: var(--open) }

.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font-weight: 600 }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-fg) }
.btn.quiet { border-color: transparent; background: transparent; color: var(--brand); padding-inline: 8px }
.btn.danger { color: var(--open); border-color: var(--open) }
.btn:disabled { opacity: .5; cursor: default }

/* Plan-Tabelle */
.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; box-shadow: var(--shadow) }
table.plan { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed }
.plan th, .plan td { border-bottom: 1px solid var(--line); vertical-align: top; text-align: left }
.plan tbody tr:last-child > * { border-bottom: 0 }
.plan thead th { padding: 12px 10px; background: var(--surface); font-weight: 600 }
.plan .st { position: sticky; left: 0; z-index: 1; background: var(--surface); width: 190px; padding: 10px 12px; border-right: 1px solid var(--line); font-weight: 400 }
.plan .st b { display: block; font-weight: 700; line-height: 1.25 }
.plan .st small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.3; margin-top: 2px }
.plan col.sc { width: auto; min-width: 150px }
.plan td { padding: 4px; min-width: 150px }
.plan tr.grp th { background: var(--surface-2); padding: 6px 12px; font: 600 11.5px var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted) }
.plan tr.grp th span { position: sticky; left: 12px }
.plan.wide { min-width: calc(190px + var(--cols) * 150px) }

.cell { display: flex; flex-direction: column; gap: 3px; width: 100%; min-height: 54px; text-align: left; padding: 7px 9px; border: 1px solid transparent; border-radius: 8px; background: transparent; line-height: 1.3 }
button.cell:hover { background: var(--surface-2) }
.cell .p { display: block; overflow-wrap: anywhere }
.cell .note { font-size: 12.5px; color: var(--muted) }
.cell .tag { font-size: 12px; font-weight: 700; letter-spacing: .02em }
.cell.is-open { border: 1px dashed var(--open); background: var(--open-soft) }
.cell.is-open .tag { color: var(--open) }
.cell.is-part { background: var(--part-soft) }
.cell.is-part .tag, .cell.is-tent .tag { color: var(--part) }
.cell.is-tent { border: 1px dashed var(--part) }
.cell.is-off { color: var(--muted); font-size: 13px; justify-content: center;
  background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface-2) 6px 8px) }
button.cell.is-open:hover { background: var(--open-soft); border-style: solid }
button.cell.is-part:hover { background: var(--part-soft); border-color: var(--part) }
.dbl { color: var(--open); font-weight: 700; white-space: nowrap }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.sw { width: 18px; height: 12px; border-radius: 3px; border: 1px solid var(--line) }
.sw.open { border: 1px dashed var(--open); background: var(--open-soft) } .sw.part { background: var(--part-soft); border-color: transparent }
.sw.off { background: repeating-linear-gradient(135deg, transparent 0 3px, var(--surface-2) 3px 5px) }
.notes { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch }
.notes h3, .sect h3 { font: 600 11.5px var(--f-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted) }
.notes li { padding-left: 14px; position: relative }
.notes li::before { content: ""; position: absolute; left: 0; top: .6em; width: 5px; height: 5px; border-radius: 50%; background: var(--brand) }

/* Listen: Offen, Personen, Einrichten */
.sect { display: flex; flex-direction: column; gap: 8px }
.sect h2 { font: 700 20px/1.2 var(--f-display); letter-spacing: -.01em }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.list > li + li { border-top: 1px solid var(--line) }
.item { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; width: 100%; padding: 11px 14px; background: none; border: 0; text-align: left }
button.item:hover { background: var(--surface-2) }
.item .main { flex: 1 1 200px; min-width: 0 }
.item .main b { font-weight: 600 }
.item .main small { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere }
.pill { font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 2px 10px; white-space: nowrap }
.pill.open { background: var(--open-soft); color: var(--open) } .pill.part { background: var(--part-soft); color: var(--part) }
.pill.plain { background: var(--surface-2); color: var(--muted); font-weight: 600 }
.shifthead { display: flex; gap: 10px; align-items: baseline; padding: 9px 14px; background: var(--surface-2); font-weight: 600 }
.person-body { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 10px }
.person-body li { display: flex; flex-wrap: wrap; gap: 2px 12px; padding: 6px 0; border-top: 1px solid var(--line) }
.person-body li .when { flex: 0 0 170px }
.caret { color: var(--muted); transition: transform .15s; display: inline-block }
[aria-expanded="true"] .caret { transform: rotate(90deg) }
@media (prefers-reduced-motion: reduce) { .caret { transition: none } }
.search { flex: 1 1 220px; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 24px; align-items: start }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 28px 20px; max-width: 60ch }
.empty h2 { font: 700 20px var(--f-display); margin-bottom: 6px }
.banner { background: var(--part-soft); color: var(--part); border-radius: 8px; padding: 9px 14px; font-weight: 500 }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60 }
.star { color: var(--star); font-weight: 700 }
.day[aria-pressed="true"] .star { color: inherit }
.banner.info { background: var(--surface-2); color: var(--muted) }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(480px, calc(100vw - 32px)); background: var(--surface); color: var(--fg); box-shadow: var(--shadow) }
dialog::backdrop { background: rgba(10,16,13,.55) }
#dform { display: flex; flex-direction: column; gap: 16px; padding: 20px }
#dform header h2 { font: 700 22px/1.15 var(--f-display); letter-spacing: -.01em }
#dform header .eyebrow { font: 500 13px var(--f-mono); color: var(--brand); margin-bottom: 4px }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.field label, .field .lab { font-weight: 600; font-size: 14px }
.field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; font: inherit; color: inherit }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.addrow { display: flex; gap: 8px } .addrow input { flex: 1 }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips li { display: inline-flex; align-items: center; gap: 2px; background: var(--brand-soft); border-radius: 999px; padding: 3px 4px 3px 12px; font-weight: 600 }
.chips li button { background: none; border: 0; border-radius: 50%; width: 26px; height: 26px; font-size: 17px; line-height: 1; color: inherit }
.chips li button:hover { background: var(--surface) }
.hint { font-size: 13px; color: var(--muted) } .hint.warn { color: var(--open); font-weight: 600 }
.check { display: flex; gap: 10px; align-items: flex-start } .check input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--brand) }
#dform footer { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center }
#dform footer .left { margin-right: auto }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 50; max-width: calc(100vw - 32px); box-shadow: var(--shadow) }

@media (max-width: 760px) {
  .plan .st { width: 46%; position: static }
  .plan td { min-width: 0 }
  .plan.wide { min-width: 0 }
  .person-body li .when { flex-basis: 100% }
  .two { grid-template-columns: 1fr }
  .tabs button { padding-inline: 9px; font-size: 14px }
  .tabs .n { margin-left: 4px; padding-inline: 5px }
  .row.groups { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px }
  .row.groups .chip { flex: none }
}

/* Hellgrünes Design, bewusst nur hell */
:root { --bg: #E9F4E4; --surface: #FFFFFF; --surface-2: #D9ECD2; --line: #BFDCB4; --fg: #15261B; --muted: #4C6453;
  --brand: #2A7F39; --brand-fg: #FFFFFF; --brand-soft: #CFE9C8; --open: #A3233A; --open-soft: #FBE8EC; --part: #7A4F00; --part-soft: #FBEDCB; --star: #B07A00;
  --shadow: 0 1px 2px rgba(21,38,27,.06), 0 8px 24px rgba(21,38,27,.07); color-scheme: light }
html { overflow-x: hidden }
body { overflow-x: clip }
.chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-fg) }
.selrow { display: flex; align-items: center; gap: 10px; font-weight: 600 }
.selrow select { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--fg) }
.homehelp { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px }
.homehelp h3 { font: 700 18px/1.2 var(--f-display) }
.homehelp .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px 28px }
.homehelp ol { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px }
@media (max-width: 760px) {
  .tabs { overflow-x: visible; flex-wrap: wrap; gap: 0 2px }
  .tabs button { flex: 1 1 auto; padding: 9px 6px 8px; font-size: 13.5px; text-align: center }
  .tabs .n { margin-left: 3px; padding-inline: 4px; font-size: 11px }
  .shiftpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); overflow: visible; padding-bottom: 0 }
  .shiftpick button { padding: 8px; min-width: 0 }
  .shead .t { font-size: 13px }
  input, select, textarea { font-size: 16px !important }
}

/* Vorschau: Anmeldung, Rollen, SOS */
a.btn { text-decoration: none; display: inline-flex; align-items: center; color: var(--fg) }
a.btn.primary { color: var(--brand-fg) }
.gate { display: flex; flex-direction: column; gap: 16px; max-width: 480px }
.gatecard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px }
.gatecard h2 { font: 700 24px/1.15 var(--f-display); letter-spacing: -.01em; text-wrap: balance }
.gatecard form { display: flex; flex-direction: column; gap: 14px }
.gatecard form > .btn { align-self: flex-start }
.gatealt { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 22px; font-weight: 600 }
.claims { display: flex; flex-direction: column; gap: 8px; align-items: stretch }
.claims .btn { text-align: left }
.userbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; font-size: 14px }
.userbar select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px }
.role { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: var(--brand-soft); color: var(--brand); margin-left: 8px }
.cell.mine { background: var(--brand-soft); border-color: var(--brand) }
.cell .p.me { font-weight: 700 }
.sw.mine { background: var(--brand-soft); border-color: var(--brand) }
.pick { display: flex; flex-wrap: wrap; gap: 6px }
.pick .chip[aria-pressed="true"] { background: var(--open); border-color: var(--open); color: var(--bg) }
.btn.sosgo { background: var(--open); border-color: var(--open); color: var(--bg); letter-spacing: .02em }
.chips li.ro { padding: 5px 12px }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0 }
.brand .logo { width: 64px; height: 64px; flex: none; background: var(--surface); border-radius: 50%; border: 1px solid var(--line) }
.gatelogo { width: min(60%, 220px); height: auto; align-self: center }
.reach { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px }
.reach h2 { font: 700 18px/1.2 var(--f-display) }
.role.strong { background: var(--brand); color: var(--brand-fg) }
.pill.role-pill { background: var(--brand); color: var(--brand-fg) }
@media (max-width: 760px) { .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 0 } .tabs button { padding-inline: 4px; font-size: 13.5px } }
:root { --sos: #D31F30 }
.tabs button.t-sos, .tabs button.t-sos[aria-selected="true"] { color: var(--sos) }
.tabs button.t-sos[aria-selected="true"] { border-bottom-color: var(--sos) }
.btn.sosgo, .pick .chip[aria-pressed="true"] { background: var(--sos); border-color: var(--sos); color: #FFFFFF }
.sosbox { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 26px 16px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; text-align: center }
.sosbox p { margin-top: 14px; max-width: 34ch }
.beacon { position: relative; width: 58px; height: 44px; border-radius: 29px 29px 5px 5px; background: #1763E6; box-shadow: inset 0 -8px 12px rgba(0,0,40,.35), inset 6px 4px 10px rgba(255,255,255,.45) }
.beacon i { position: absolute; left: 50%; top: 50%; width: 190px; height: 190px; margin: -95px 0 0 -95px; border-radius: 50%; background: radial-gradient(circle, rgba(60,140,255,.65) 0%, rgba(60,140,255,.25) 35%, rgba(60,140,255,0) 68%); pointer-events: none; animation: tatue 1.1s linear infinite }
.beacon { animation: tatue-dome 1.1s linear infinite }
.beacon-base { width: 78px; height: 10px; border-radius: 3px 3px 5px 5px; background: #2A2F36; position: relative; z-index: 1 }
.sosbig { position: relative; z-index: 1; margin-top: 12px; width: min(100%, 300px); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px 16px 18px; border: 0; border-radius: 18px; background: var(--sos); color: #FFFFFF; box-shadow: 0 4px 0 #9C1422, 0 12px 24px rgba(211,31,48,.3) }
.sosbig b { font: 700 40px/1 var(--f-display); letter-spacing: .06em }
.sosbig span { font-weight: 600; font-size: 14px }
.sosbig:active { transform: translateY(3px); box-shadow: 0 1px 0 #9C1422, 0 6px 12px rgba(211,31,48,.3) }

/* ---------- Datenmodell ---------- */
const dayInfo = d => { const [y, m, dd] = d.split('-').map(Number); const dt = new Date(y, m - 1, dd);

/* Kalender: Google-Link und Kalenderdatei */
function evt(sh, st) { const pad = n => String(n).padStart(2, '0'), [y, mo, d] = sh.date.split('-').map(Number), s = mins(sh.start), e = s + dur(sh);
  const f = min => { const dt = new Date(Date.UTC(y, mo - 1, d, 0, min)); return dt.getUTCFullYear() + pad(dt.getUTCMonth() + 1) + pad(dt.getUTCDate()) + 'T' + pad(dt.getUTCHours()) + pad(dt.getUTCMinutes()) + '00'; };
  return { uid: sh.id + '-' + st.id + '@sternenzauber', title: 'Sternenzauber: ' + st.name, start: f(s), end: f(e), place: st.place || '', note: 'Schicht ' + span(sh) + ' Uhr' }; }
function gcal(sh, st) { const e = evt(sh, st);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(e.title) + '&dates=' + e.start + '/' + e.end + '&ctz=Europe/Berlin&location=' + encodeURIComponent(e.place) + '&details=' + encodeURIComponent(e.note); }
function ics(slots) { const x = s => String(s).replace(/([,;\\])/g, '\\$1');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Sternenzauber//Helferplan//DE'].concat(...slots.map(({ sh, st }) => { const e = evt(sh, st);
    return ['BEGIN:VEVENT', 'UID:' + e.uid, 'DTSTART:' + e.start, 'DTEND:' + e.end, 'SUMMARY:' + x(e.title)].concat(e.place ? ['LOCATION:' + x(e.place)] : [], ['DESCRIPTION:' + x(e.note), 'END:VEVENT']); }), ['END:VCALENDAR']).join('\r\n'); }
const calRow = (sh, st) => '<span class="row"><a class="btn" href="' + esc(gcal(sh, st)) + '" target="_blank" rel="noopener">Google Kalender</a><button type="button" class="btn" data-cal="' + esc(sh.id) + '|' + esc(st.id) + '">Kalenderdatei</button></span>';
function saveFile(name, text, type, title, hint) {
  if (STANDALONE) { try { const url = URL.createObjectURL(new Blob([text], { type })), a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Datei wird gespeichert'); return; } catch (e) {} }
  openDlg({ type: 'text', title, hint, text }); }
function showIcs(slots) {
  if (STANDALONE) return saveFile('sternenzauber-schichten.ics', ics(slots), 'text/calendar;charset=utf-8');
  openDlg({ type: 'text', title: 'Kalenderdatei', hint: 'In der fertigen App öffnet dieser Knopf direkt den Kalender auf dem Handy. In der Vorschau siehst du den Inhalt der Datei.', text: ics(slots) });
}

/* ---------- Plan als PDF ---------- */
function loadScript(src) { return new Promise((ok, no) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = no; document.head.appendChild(el); }); }
async function pdfLib() { if (!window.jspdf) await loadScript('vendor/jspdf.umd.min.js'); if (!window.jspdf.jsPDF.API.autoTable) await loadScript('vendor/jspdf.plugin.autotable.min.js'); }
function pdfStamp() { const now = new Date(), pad = n => String(n).padStart(2, '0'); return 'Stand ' + now.getDate() + '.' + (now.getMonth() + 1) + '.' + now.getFullYear() + ', ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ' Uhr'; }
function pdfFoot(doc, left) { const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) { doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(130, 134, 155); doc.text('Seite ' + p + ' von ' + pages, 285, 204, { align: 'right' }); doc.text(left, 12, 204); }
  return pages; }
function showPdf(r, name, label) { let file = null, share = false; try { file = new File([r.blob], name, { type: 'application/pdf' }); share = !!navigator.canShare && navigator.canShare({ files: [file] }); } catch (x) {}
  openDlg({ type: 'pdfdone', url: URL.createObjectURL(r.blob), name, file, share, pages: r.pages, label }); }
/* Helferliste für die Orga: alle Personen aus Plan und Helferliste mit Kontaktdaten und Einsätzen */

  doc.autoTable({ head: [['Name im Plan', 'Vorname', 'Nachname', 'Handynummer', 'E-Mail', 'Einsätze', 'Stunden', 'Nächstes Jahr', 'Hinweis']], body, startY: 25, margin: { top: 12, left: 12, right: 12, bottom: 12 }, theme: 'grid', rowPageBreak: 'avoid',

  return { blob: doc.output('blob'), pages: pdfFoot(doc, (m.info.title || 'Sternenzauber') + ' · Helferliste · vertraulich') };

async function makePdf(group, day) {
  await pdfLib();

  const title = (m.info.title || 'Sternenzauber') + ' · Standbesetzung', stamp = 'Stand ' + now.getDate() + '.' + (now.getMonth() + 1) + '.' + now.getFullYear() + ', ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ' Uhr';
  days.forEach((d, idx) => { if (idx) doc.addPage(); const i = dayInfo(d), shifts = m.shifts.filter(x => x.date === d);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(43, 47, 74); doc.text(title, 12, 14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(87, 92, 120);
    doc.text(i.wdl + ', ' + i.d + '. ' + MON[i.m - 1] + ' ' + i.y + '   ·   ' + (group === 'all' ? 'Alle Bereiche' : group) + '   ·   ' + stamp, 12, 20.5);
    const body = []; let last = null;
    sts.forEach(st => {
      if (grp(st) !== last) { last = grp(st); body.push([{ content: last.toUpperCase(), colSpan: shifts.length + 1, styles: { fillColor: [225, 228, 239], textColor: [87, 92, 120], fontStyle: 'bold', fontSize: 8, cellPadding: { top: 1.2, bottom: 1.2, left: 2, right: 2 } } }]); }
      body.push([{ content: st.name + '\n' + [st.place, needText(st)].filter(Boolean).join(' · '), styles: { fontStyle: 'bold' } }].concat(shifts.map(sh => { const c = statusOf(sh, st);
        if (c.k === 'off') return { content: c.note || 'geschlossen', styles: { textColor: [130, 134, 155], fillColor: [240, 241, 246], fontStyle: 'italic' } };
        const lines = c.people.slice(); if (c.k === 'open') lines.push('offen · ' + missText(c)); else if (c.k === 'part') lines.push('(' + missText(c) + (c.tentative ? ', unbestätigt' : '') + ')'); else if (c.k === 'tent') lines.push('(unbestätigt)');
        if (c.note) lines.push(c.note);
        return { content: lines.join('\n'), styles: c.k === 'open' ? { fillColor: [251, 232, 236], textColor: [179, 34, 60], fontStyle: 'bold' } : c.k === 'part' || c.k === 'tent' ? { fillColor: [251, 237, 203] } : {} }; }))); });
    doc.autoTable({ head: [['Stand'].concat(shifts.map(x => span(x) + ' Uhr'))], body, startY: 25, margin: { top: 12, left: 12, right: 12, bottom: 12 }, theme: 'grid', rowPageBreak: 'avoid',
      styles: { font: 'helvetica', fontSize: 9, cellPadding: 1.8, lineColor: [203, 208, 224], lineWidth: 0.2, textColor: [27, 30, 51], valign: 'top', overflow: 'linebreak' },
      headStyles: { fillColor: [43, 47, 74], textColor: 255, fontStyle: 'bold' }, columnStyles: { 0: { cellWidth: 50 } } }); });
  return { blob: doc.output('blob'), pages: pdfFoot(doc, m.info.title || 'Sternenzauber') };
}
